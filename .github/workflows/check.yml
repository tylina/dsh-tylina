name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Prepare pinned private core
        env:
          TYLINA_SOURCE_SSH_KEY: ${{ secrets.TYLINA_SOURCE_SSH_KEY }}
        run: node scripts/prepare-ci-source.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
